name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    name: TypeScript build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install module dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (src + plugin)
        run: npm run prepare
        env:
          CI: "true"

      - name: Typecheck the example app
        working-directory: example
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit

  fusion-core:
    name: C++ Kalman/fusion host test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & run the fusion core test
        working-directory: android/src/main/cpp
        run: |
          g++ -std=c++17 -O2 kalman.cpp fusion.cpp test_fusion.cpp -o test_fusion
          ./test_fusion

  kotlin:
    name: Kotlin lint & pure-logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Kotlin compiler
        run: |
          curl -sL https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip -o kotlin.zip
          unzip -q kotlin.zip
          echo "$PWD/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Pure-logic unit tests (GeoMath)
        run: |
          kotlinc android/src/main/java/expo/modules/geopulse/util/GeoMath.kt tools/host-test/GeoMathTest.kt -include-runtime -d /tmp/geomath-test.jar
          java -jar /tmp/geomath-test.jar

      - name: ktlint
        run: |
          curl -sL https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint -o "$RUNNER_TEMP/ktlint"
          chmod +x "$RUNNER_TEMP/ktlint"
          cd android/src/main/java
          "$RUNNER_TEMP/ktlint" --editorconfig="$GITHUB_WORKSPACE/.editorconfig" "**/*.kt"
